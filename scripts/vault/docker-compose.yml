services:
  vault-db:
    image: postgres:16-alpine
    container_name: vault-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vault
      - POSTGRES_USER=vault
      - POSTGRES_PASSWORD=vault
    volumes:
      - vault-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  vault-backend:
    build:
      context: ../..
      dockerfile: scripts/vault/backend/Dockerfile
    container_name: vault-backend
    restart: unless-stopped
    ports:
      - "5055:5050"
    volumes:
      - ../../secrets:/app/secrets
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: ../../secrets/keycloak.env
        required: false
    environment:
      - VAULT_REPO_ROOT=/app     # scripts/ copied to /app/scripts/ in image
      - VAULT_DATABASE_URL=host=vault-db port=5432 dbname=vault user=vault password=vault
    depends_on:
      vault-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5050/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - default
      - businessplanner_kc
      - nextra_kc
      - metabuilder_net
      - businessplanner_pkgrepo   # reach pkgrepo-backend (:5002) for rotation

  vault-frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: vault-frontend
    restart: unless-stopped
    ports:
      - "4100:3000"
    environment:
      - FLASK_URL=http://vault-backend:5050
    depends_on:
      vault-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null",
             "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  default: {}
  businessplanner_kc:
    external: true
    name: businessplanner-deploy_default
  nextra_kc:
    external: true
    name: next_extra_primary_default
  metabuilder_net:
    external: true
    name: metabuilder-network
  businessplanner_pkgrepo:
    external: true
    name: businessplanner_default

volumes:
  vault-db:
