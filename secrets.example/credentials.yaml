credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "jenkins-agent-ssh-key"
              description: "SSH key for Docker Jenkins agents"
              username: "jenkins"
              privateKeySource:
                directEntry:
                  privateKey: |
                    -----BEGIN OPENSSH PRIVATE KEY-----
                    replace-with-private-key-body
                    -----END OPENSSH PRIVATE KEY-----
          - usernamePassword:
              scope: GLOBAL
              id: "nexus-admin"
              description: "Nexus admin for MetaBuilder image push"
              username: "${NEXUS_ADMIN_USER}"
              password: "${NEXUS_ADMIN_PASSWORD}"
