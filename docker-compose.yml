services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_home/casc.d/jenkins.yaml:ro
      - ./secrets/credentials.yaml:/var/jenkins_home/casc.d/credentials.yaml:ro
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.d
    networks:
      - jenkins_net

  jenkins-agent-1:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: jenkins-agent-1
    restart: unless-stopped
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGL4pxR6BcZ6gx70I6w0yLC3tUe5tFH6BNj4vl6HWFzc jenkins-agent
    volumes:
      - agent-1-home:/home/jenkins/agent
    networks:
      - jenkins_net

