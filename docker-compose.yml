x-agent-base: &agent-base
  build:
    context: .
    dockerfile: Dockerfile.agent
    args:
      DOCKER_GID: "${DOCKER_GID:-984}"
  restart: unless-stopped
  environment:
    - JENKINS_AGENT_SSH_PUBKEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINPCCdpG9EpNhiLiLoJgeC4ELi0KDVmMSSDQcbD8zIG/ jenkins-agent
  group_add:
    - "${DOCKER_GID:-984}"
  networks:
    - jenkins_net

services:
  nginx:
    image: nginx:alpine
    container_name: jenkins-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
      - "8082:8082"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - jenkins_net
    depends_on:
      - jenkins

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    # Lightweight Docker registry replacing Nexus, whose JVM
    # alone reserved more than host RAM. Same :5001 endpoint
    # so every job/bake REGISTRY ref keeps working. localhost
    # is an insecure registry by default -> no docker login.
    ports:
      - "5001:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - jenkins_net

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "50000:50000"
    env_file:
      - ./secrets/jenkins.env
      - ./secrets/nexus.env
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_home/casc.d/jenkins.yaml:ro
      - ./secrets/credentials.yaml:/var/jenkins_home/casc.d/credentials.yaml:ro
    environment:
      - "JAVA_OPTS=-Djenkins.install.runSetupWizard=false"
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.d
    networks:
      - jenkins_net

  jenkins-agent-1:
    <<: *agent-base
    container_name: jenkins-agent-1
    volumes:
      - agent-1-home:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

  jenkins-agent-2:
    <<: *agent-base
    container_name: jenkins-agent-2
    volumes:
      - agent-2-home:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

  jenkins-agent-3:
    <<: *agent-base
    container_name: jenkins-agent-3
    volumes:
      - agent-3-home:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

  jenkins-agent-4:
    <<: *agent-base
    container_name: jenkins-agent-4
    volumes:
      - agent-4-home:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

  jenkins-agent-5:
    <<: *agent-base
    container_name: jenkins-agent-5
    volumes:
      - agent-5-home:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

  jenkins-agent-6:
    <<: *agent-base
    container_name: jenkins-agent-6
    volumes:
      - agent-6-home:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

  jenkins-agent-7:
    <<: *agent-base
    container_name: jenkins-agent-7
    volumes:
      - agent-7-home:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

  jenkins-agent-8:
    <<: *agent-base
    container_name: jenkins-agent-8
    volumes:
      - agent-8-home:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock

# 8 SSH agents (jenkins-agent-1..8): restored from the interim 4-agent
# trim now the host is a 32 GB / ~225 GB Vultr box, not the old
# 4 GB / 100 GB server. Matches the 8-agent JCasC node set in casc.yaml.

volumes:
  jenkins_home:
  agent-1-home:
  agent-2-home:
  agent-3-home:
  agent-4-home:
  agent-5-home:
  agent-6-home:
  agent-7-home:
  agent-8-home:
  registry_data:

networks:
  jenkins_net:
