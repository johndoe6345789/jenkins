jenkins:
  systemMessage: "Jenkins — C++/CMake + npm/Next.js CI"
  numExecutors: 0
  scmCheckoutRetryCount: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: scrambled
          properties:
            - mailer:
                emailAddress: ""

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  nodes:
    - permanent:
        name: "agent-1"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 8
        mode: NORMAL
        labelString: "linux"
        launcher:
          ssh:
            host: "jenkins-agent"
            port: 22
            credentialsId: "jenkins-agent-ssh-key"
            sshHostKeyVerificationStrategy:
              manuallyTrustedKeyVerificationStrategy:
                requireInitialManualTrust: false

tool:
  nodejs:
    installations:
      - name: "Node 22"
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "22.14.0"
                    npmPackagesRefreshHours: 72

unclassified:
  timestamper:
    allPipelines: true
  ansiColorBuildWrapper:
    globalColorMapName: "xterm"
