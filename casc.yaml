tool:
  nodejs:
    installations:
      - name: "Node 22"
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "22.14.0"
                    npmPackagesRefreshHours: 72
      - name: "node25"
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "25.9.0"
                    npmPackagesRefreshHours: 72

security:
  contentSecurityPolicy:
    enforce: true

unclassified:
  location:
    url: "http://localhost:8081/"
  resourceRoot:
    url: "http://localhost:8082/"
  timestamper:
    allPipelines: true
  ansiColorBuildWrapper:
    globalColorMapName: "xterm"
