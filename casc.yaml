jenkins:
  systemMessage: "Jenkins — C++/CMake + npm/Next.js CI"
  numExecutors: 0
  scmCheckoutRetryCount: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: scrambled
          properties:
            - mailer:
                emailAddress: ""
        - id: uksodev
          password: "${JENKINS_UKSODEV_PASSWORD}"
          properties:
            - mailer:
                emailAddress: ""

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  nodes:
    - permanent:
        name: "agent-1"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: NORMAL
        labelString: "linux"
        launcher:
          ssh:
            host: "jenkins-agent-1"
            port: 22
            credentialsId: "jenkins-agent-ssh-key"
            sshHostKeyVerificationStrategy:
              manuallyTrustedKeyVerificationStrategy:
                requireInitialManualTrust: false
    - permanent:
        name: "agent-2"
